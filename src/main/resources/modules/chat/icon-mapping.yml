########################################################################################################################
#
# Icon Mapping Configuration
#
# Allows players to type :icon_name: in chat to display custom icons/glyphs.
# Tab completion shows available icons when typing ':'.
#
# Permission logic (per icon):
#   1. If the player has the CATEGORY permission  → all icons in that category are unlocked.
#   2. Else if the icon has its own permission     → that permission is checked.
#   3. If neither is configured                   → everyone can use the icon.
#
# Tab completion format:
#   :icon_name:  (when tab field is blank)
#   :icon_name: <tab_char>  (when tab field has a value)
#
########################################################################################################################

