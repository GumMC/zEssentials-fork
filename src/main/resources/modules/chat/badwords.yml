# ═══════════════════════════════════════════════════════════════════════════════
# BAD WORDS FILTER CONFIGURATION
# ═══════════════════════════════════════════════════════════════════════════════
#
# HOW IT WORKS:
# - Uses word boundaries (\b) to prevent false positives
# - "sex" will match "sex" but NOT "sexy" (no word boundary)
# - Case insensitive (matches SEX, Sex, sex)
# - Words are processed as-is, no special config needed
#
# WORD BOUNDARY EXAMPLES:
#   "fuck"      → matches "fuck", "FUCK", "Fuck"
#   "ass"       → matches "ass", but NOT "assassin" (no boundary)
#   "sex"       → matches "sex", but NOT "sexy", "sexual"
# ═══════════════════════════════════════════════════════════════════════════════

# Enable bad words filtering
enabled: true

# Replacement text for bad words
replacement: "***"

# Maximum warns before executing punishments
# Set to -1 to disable the warn system
maxWarns: 3

# Commands to execute when max warns is reached
# Use %player% as placeholder for player name
punishments:
  - "warn -s %player% BadWords"

# Permission to bypass bad words filtering
# Leave empty to disable bypass
bypass-permission: "essentials.chat.bypass.badwords"

# List of bad words (exact matches - case insensitive)
# Word boundaries (\b) are automatically added to prevent false positives
